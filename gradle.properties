# bnd 7.3.0 shipped a regression in the -pom snapshot handling; fixed in 7.4.0.
bnd_version=7.4.0

# Keep non-project root folders from being auto-discovered as bnd projects.
# The bnd workspace plugin sweeps all root folders (except dot-folders, buildSrc, gradle)
# into the project graph.
bnd_exclude=build,dist,docs

# --- Project coordinates (single source of truth) ---
# Used by Gradle directly and imported into bnd via `-include` in cnf/ext/fennec.bnd.
github_org=geckoprojects-org
github_repository=org.gecko.bnd.sbom
maven_group_id=org.geckoprojects.bnd.sbom
