# GitHub adapter of bnd update (docs/bnd-update.md): runs `bnd-update apply` in a bnd workspace
# and opens or updates one pull request with the result. The logic is in the CLI; this action
# only fetches it, runs it and hands the changes to a pull request.
#
# Needs Java 21 on the runner (actions/setup-java) and, for the build command, whatever the
# workspace's build needs. Use from other repositories as
#   uses: geckoprojects-org/org.gecko.bnd.sbom/.github/actions/bnd-update@<commit>
name: bnd update
description: Apply updates to a bnd workspace (all, a selection, or the fixes of a Trivy report), verify that every bndrun resolves and the build passes, and open a pull request.

inputs:
  workspace:
    description: The bnd workspace (directory that contains cnf), relative to the repository.
    default: '.'
  mode:
    description: "'each' applies the updates one by one and keeps what passes; 'all' applies them together, all or nothing."
    default: each
  scope:
    description: Default scope of the version policy for this run (micro, minor, major). Empty uses the workspace's -update-policy.
    default: ''
  only:
    description: Only these libraries, comma separated groupId:artifactId patterns ('*' matches any part).
    default: ''
  trivy-report:
    description: Trivy JSON report; when set, the fixes for its vulnerabilities are applied instead of all updates.
    default: ''
  sbom:
    description: The CycloneDX SBOM the Trivy report was made from (adds where each library sits).
    default: ''
  build-command:
    description: Build to run after resolving, in the workspace (e.g. './gradlew build -x test --no-daemon'). A failing build reverts the update.
    default: ''
  cli-jar:
    description: Path of a org.gecko.bnd.update.cli jar to use. Empty downloads cli-version.
    default: ''
  cli-version:
    description: Version of org.geckoprojects.bnd:org.gecko.bnd.update.cli to download (a -SNAPSHOT comes from the Central snapshot repository).
    default: 0.1.0-SNAPSHOT
  create-pull-request:
    description: Open or update a pull request with the applied updates.
    default: 'true'
  branch:
    description: Branch of the pull request; updated in place on later runs.
    default: bnd-update/updates
  title:
    description: Title of the pull request.
    default: 'bnd update: dependency updates'
  labels:
    description: Labels of the pull request, comma separated.
    default: dependencies
  token:
    description: >-
      Token for pushing the branch and opening the pull request. With the default GITHUB_TOKEN no
      workflow runs on the pull request (GitHub does not trigger workflows on events caused by it);
      use a GitHub App or fine-grained token to get CI checks on it.
    default: ${{ github.token }}
  fail-on-reverted:
    description: Fail the step when an update had to be reverted (after the pull request for the others is opened).
    default: 'false'

outputs:
  exit-code:
    description: "Exit code of bnd-update apply: 0 nothing applied, 1 updates applied, 2 an update was reverted."
    value: ${{ steps.apply.outputs.exit-code }}
  report:
    description: Path of the Markdown report.
    value: ${{ steps.apply.outputs.report }}
  pull-request-url:
    description: URL of the opened or updated pull request, if any.
    value: ${{ steps.pr.outputs.pull-request-url }}

runs:
  using: composite
  steps:
    - name: Get bnd update
      id: cli
      shell: bash
      env:
        CLI_JAR: ${{ inputs.cli-jar }}
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail
        command -v java >/dev/null || { echo "::error::bnd update needs Java 21 on the runner (actions/setup-java)"; exit 1; }
        if [ -n "$CLI_JAR" ]; then
          jar="$(realpath "$CLI_JAR")"
        else
          base="org/geckoprojects/bnd/org.gecko.bnd.update.cli/$CLI_VERSION"
          if [[ "$CLI_VERSION" == *-SNAPSHOT ]]; then
            repo="https://central.sonatype.com/repository/maven-snapshots"
            # the latest snapshot is named by <snapshot><timestamp> and <buildNumber>; the
            # <snapshotVersion> list also holds older builds
            meta="$(curl -fsSL "$repo/$base/maven-metadata.xml" | tr -d ' \n')"
            ts="$(printf '%s' "$meta" | sed -n 's:.*<timestamp>\([^<]*\)</timestamp>.*:\1:p')"
            bn="$(printf '%s' "$meta" | sed -n 's:.*<buildNumber>\([^<]*\)</buildNumber>.*:\1:p')"
            [ -n "$ts" ] && [ -n "$bn" ] || { echo "::error::no snapshot of $CLI_VERSION in $repo"; exit 1; }
            file="org.gecko.bnd.update.cli-${CLI_VERSION%-SNAPSHOT}-$ts-$bn.jar"
          else
            repo="https://repo.maven.apache.org/maven2"
            file="org.gecko.bnd.update.cli-$CLI_VERSION.jar"
          fi
          jar="$RUNNER_TEMP/$file"
          curl -fsSL -o "$jar" "$repo/$base/$file"
          # the repository's checksum, so a truncated or altered download is not run
          expected="$(curl -fsSL "$repo/$base/$file.sha1")"
          echo "${expected%% *}  $jar" | sha1sum -c --strict -
        fi
        echo "jar=$jar" >> "$GITHUB_OUTPUT"

    - name: Apply updates
      id: apply
      shell: bash
      working-directory: ${{ inputs.workspace }}
      env:
        JAR: ${{ steps.cli.outputs.jar }}
        MODE: ${{ inputs.mode }}
        SCOPE: ${{ inputs.scope }}
        ONLY: ${{ inputs.only }}
        TRIVY: ${{ inputs.trivy-report }}
        SBOM: ${{ inputs.sbom }}
        BUILD: ${{ inputs.build-command }}
      run: |
        set -uo pipefail
        report="$RUNNER_TEMP/bnd-update.md"
        args=(apply --mode "$MODE" --format markdown --output "$report")
        [ -n "$SCOPE" ] && args+=(--scope "$SCOPE")
        [ -n "$ONLY" ] && args+=(--only "$ONLY")
        [ -n "$TRIVY" ] && args+=(--from-vulnerabilities "$TRIVY")
        [ -n "$SBOM" ] && args+=(--sbom "$SBOM")
        [ -n "$BUILD" ] && args+=(--build-command "$BUILD")
        # the runner's bash runs with -e: catch the exit code instead of stopping here
        code=0
        java -jar "$JAR" "${args[@]}" || code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        [ -f "$report" ] && cat "$report" >> "$GITHUB_STEP_SUMMARY"
        # 0 nothing applied, 1 applied, 2 something reverted; everything else is a failure
        case "$code" in 0|1|2) exit 0 ;; *) echo "::error::bnd-update apply failed with exit code $code"; exit "$code" ;; esac

    - name: Open pull request
      id: pr
      if: inputs.create-pull-request == 'true' && (steps.apply.outputs.exit-code == '1' || steps.apply.outputs.exit-code == '2')
      uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
      with:
        token: ${{ inputs.token }}
        branch: ${{ inputs.branch }}
        title: ${{ inputs.title }}
        body-path: ${{ steps.apply.outputs.report }}
        labels: ${{ inputs.labels }}
        commit-message: ${{ inputs.title }}
        signoff: true
        delete-branch: true

    - name: Reverted updates
      if: inputs.fail-on-reverted == 'true' && steps.apply.outputs.exit-code == '2'
      shell: bash
      run: |
        echo "::error::bnd update had to revert at least one update; see the report in the job summary"
        exit 2
