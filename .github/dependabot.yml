version: 2
updates:
  # Keep GitHub Actions pinned-by-SHA up to date (Dependabot rewrites the SHA and
  # its "# vX.Y.Z" comment together, so hardening does not mean staleness).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"

  # Gradle: plugins and the test-scope dependencies declared in build.gradle.
  # (bnd dependencies are managed via cnf/ext/central.mvn, not here.)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"

  # Python packages of the SBOM schema validation (hash-pinned requirements).
  - package-ecosystem: "pip"
    directory: "/.github/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"

  # The bnd-update Maven plugin (examples/maven-sbom pins its versions on purpose and is left out).
  - package-ecosystem: "maven"
    directory: "/maven-plugin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
