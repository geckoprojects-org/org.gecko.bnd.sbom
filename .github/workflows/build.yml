# GitHub Actions is the pre-gate only: licence header check, build, test — on every branch.
# Publishing is Jenkins' job (see Jenkinsfile), which is why there is no snapshot or release
# workflow here.
#
# Self-contained on purpose. This used to call eclipse-fennec/.github reusable workflows, which
# expect that org's setup and do not fit a repository in geckoprojects-org.
name: CI Build

on:
  push:
    branches:
      - '**'
  pull_request:

# Least privilege: this workflow only reads the repository. The SBOM and its Trivy scan run in
# sbom.yml.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads .licenserc.yaml at the repository root (skywalking-eyes format).
      - name: Licence header check
        uses: apache/skywalking-eyes/header@a196742f472feaffafea537ce5a2a4c3c53a8de4 # v0.9.0

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      # Handles the Gradle distribution and dependency caching.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # `build` covers compile, bnd bundle assembly and plain JUnit tests. OSGi tests run via
      # testOSGi, which Jenkins does — it needs a resolved runtime and is slower.
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      # The JUnit results as a table in the run's summary page and as annotations on failing
      # tests. annotate_only: no check run is created, so no 'checks: write' permission is needed.
      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: '**/generated/test-reports/**/TEST-*.xml'
          annotate_only: true
          detailed_summary: true
          include_passed: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            **/generated/test-reports/**/TEST-*.xml
            **/build/test-results/**/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7

  # The Maven side: the bnd-update Maven plugin (maven-plugin/, built with Maven) and the example
  # project (examples/maven-sbom/: SBOM through bnd-export-maven-plugin + the plugin's
  # vulnerabilities goal), both against the jars of this commit.
  maven:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build the bnd workspace
        run: ./gradlew assemble --no-daemon --stacktrace

      # the exporter and the update library of this commit, with the POMs bnd wrote into them
      - name: Install the workspace jars into the local Maven repository
        run: |
          for project in org.gecko.bnd.sbom org.gecko.bnd.update; do
            jar="$project/generated/$project.jar"
            unzip -p "$jar" "META-INF/maven/*/$project/pom.xml" > "$RUNNER_TEMP/$project.pom"
            mvn -B -q install:install-file -Dfile="$jar" -DpomFile="$RUNNER_TEMP/$project.pom"
          done

      - name: Build the Maven plugin
        run: mvn -B -f maven-plugin/pom.xml install

      - name: Run the Maven example with the sample Trivy report
        run: |
          mvn -B -f examples/maven-sbom/pom.xml verify -Dbnd-update.trivy=trivy-sample.json
          report=examples/maven-sbom/target/bnd-update/vulnerabilities.md
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          grep -q '\*\*2.0.18\*\* (micro)' "$report"
          grep -q 'needs a major update' "$report"

  gradle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build the bnd workspace
        run: ./gradlew assemble --no-daemon --stacktrace

      # TestKit runs the tasks on a minimal bnd workspace with the CLI of this commit
      - name: Build and test the Gradle plugin
        run: ./gradlew -p gradle-plugin build --no-daemon --stacktrace

      # ci/publish-plugins.sh as Jenkins runs it, into local directories instead of the Nexus
      # and the Portal
      - name: Publish snapshot plugins into a local directory
        run: |
          ci/publish-plugins.sh
          test -n "$(find "$RUNNER_TEMP/snapshots" -name 'bnd-update-maven-plugin-*.jar')"
          test -n "$(find "$RUNNER_TEMP/snapshots" -name 'org.geckoprojects.bnd.update.gradle.plugin-*.pom')"
        env:
          NEXUS_SNAPSHOT_URL: file://${{ runner.temp }}/snapshots
          MAVEN_REPO_LOCAL: ${{ runner.temp }}/m2

      # a release as on main, signed with a throwaway key, into dist/bundles only
      - name: Publish release plugins into dist/bundles
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg" GPG_PASSPHRASE="$(openssl rand -hex 16)"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --quiet --passphrase "$GPG_PASSPHRASE" --quick-gen-key 'CI throwaway <ci@invalid>' ed25519 sign 1d
          ./gradlew assemble --no-daemon --stacktrace
          ci/publish-plugins.sh
          jars=$(find dist/bundles -name '*.jar' | wc -l); signed=$(find dist/bundles -name '*.jar.asc' | wc -l)
          echo "dist/bundles: $jars jars, $signed signatures"
          [ "$jars" -ge 6 ] && [ "$jars" = "$signed" ]
          for a in $(find dist/bundles -name '*.asc'); do gpg --batch --quiet --verify "$a" "${a%.asc}"; done
        env:
          DO_RELEASE: 'true'
          NEXUS_RELEASE: 'false'
          MAVEN_REPO_LOCAL: ${{ runner.temp }}/m2
