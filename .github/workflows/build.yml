# GitHub Actions is the pre-gate only: licence header check, build, test — on every branch.
# Publishing is Jenkins' job (see Jenkinsfile), which is why there is no snapshot or release
# workflow here.
#
# Self-contained on purpose. This used to call eclipse-fennec/.github reusable workflows, which
# expect that org's setup and do not fit a repository in geckoprojects-org.
name: CI Build

on:
  push:
    branches:
      - '**'
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads .licenserc.yaml at the repository root (skywalking-eyes format).
      - name: Licence header check
        uses: apache/skywalking-eyes/header@61275cc80d0798a405cb070f7d3a8aaf7cf2c2c1 # v0.8.0

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      # Handles the Gradle distribution and dependency caching.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # `build` covers compile, bnd bundle assembly and plain JUnit tests. OSGi tests run via
      # testOSGi, which Jenkins does — it needs a resolved runtime and is slower.
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            **/generated/test-reports/**/TEST-*.xml
            **/build/test-results/**/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7
