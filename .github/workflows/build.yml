# GitHub Actions is the pre-gate only: licence header check, build, test — on every branch.
# Publishing is Jenkins' job (see Jenkinsfile), which is why there is no snapshot or release
# workflow here.
#
# Self-contained on purpose. This used to call eclipse-fennec/.github reusable workflows, which
# expect that org's setup and do not fit a repository in geckoprojects-org.
name: CI Build

on:
  push:
    branches:
      - '**'
  pull_request:

# Least privilege: this workflow only reads the repository. The verify job additionally may write
# code-scanning results (the Trivy report, see below).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads .licenserc.yaml at the repository root (skywalking-eyes format).
      - name: Licence header check
        uses: apache/skywalking-eyes/header@a196742f472feaffafea537ce5a2a4c3c53a8de4 # v0.9.0

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      # Handles the Gradle distribution and dependency caching.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # `build` covers compile, bnd bundle assembly and plain JUnit tests. OSGi tests run via
      # testOSGi, which Jenkins does — it needs a resolved runtime and is slower.
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      # The JUnit results as a table in the run's summary page and as annotations on failing
      # tests. annotate_only: no check run is created, so no 'checks: write' permission is needed.
      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: '**/generated/test-reports/**/TEST-*.xml'
          annotate_only: true
          detailed_summary: true
          include_passed: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            **/generated/test-reports/**/TEST-*.xml
            **/build/test-results/**/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7

      # Dogfooding: the SBOM of org.gecko.bnd.sbom/runtime.bndrun, written by the exporter that
      # was just built (task 'sbom' in org.gecko.bnd.sbom/build.gradle).
      - name: SBOM of the exporter's own runtime
        run: ./gradlew :org.gecko.bnd.sbom:sbom --no-daemon --stacktrace

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: org.gecko.bnd.sbom/generated/sbom/runtime.bndrun.cdx.json
          retention-days: 30

      # Trivy reads the SBOM and matches its components against its vulnerability database.
      # Reporting only for now: findings do not fail the build (exit-code 0).
      - name: Trivy scan of the SBOM (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: org.gecko.bnd.sbom/generated/sbom/runtime.bndrun.cdx.json
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      # The same findings as a table in the run's summary page.
      - name: Trivy scan of the SBOM (summary)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: org.gecko.bnd.sbom/generated/sbom/runtime.bndrun.cdx.json
          format: table
          output: trivy-results.txt
          exit-code: '0'
          skip-setup-trivy: true

      - name: Trivy summary
        run: |
          {
            echo '## Trivy: SBOM of runtime.bndrun'
            echo '```'
            cat trivy-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Into the repository's Security tab (code scanning). Not for Dependabot runs and pull
      # requests from forks: their token is read-only and the upload would be refused.
      - name: Upload Trivy report to code scanning
        if: github.event_name == 'push' && github.actor != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-sbom
