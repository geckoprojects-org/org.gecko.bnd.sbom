# Static security analysis of the exporter's Java code: CodeQL with the security-extended
# queries (injection, XXE, path traversal, unsafe deserialization, resource exhaustion, ...).
# Results go to the repository's Security tab. Runs on pushes to the main branches, on pull
# requests and weekly, because new queries find old code.
name: CodeQL

on:
  push:
    branches:
      - snapshot
      - main
  pull_request:
  schedule:
    # weekly, Monday 03:41 UTC
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      # bnd compiles through Gradle; CodeQL traces this build.
      - name: Build
        run: ./gradlew assemble --no-daemon --stacktrace

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: codeql-java
